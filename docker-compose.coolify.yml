# The whole system as one Coolify "Docker Compose" resource (docs/COOLIFY.md):
#   web (SPA + reverse proxy, the only public service) → api → postgres, redis, erpnext-frontend
#   ERPNext (accounting engine): erpnext-* services, private to this stack.
#   backup: nightly dumps of the app database and ERPNext into a host folder.
#
# Coolify's proxy terminates HTTPS: in Coolify set the Domains of the "web" service to
# https://almajdauto.com,https://www.almajdauto.com — no other service gets a domain and nothing publishes a port.
# Variables: ${VAR:?} must be set in Coolify; SERVICE_PASSWORD_* are generated by Coolify on the first deploy.
# Containers carry the label autoparts.service=<name> so scripts/migrate-import.sh can find them.

services:
  web:
    build:
      context: .
      dockerfile: deploy/coolify/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    labels:
      - autoparts.service=web

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-autoparts_erp};Username=${POSTGRES_USER:-autoparts};Password=${SERVICE_PASSWORD_POSTGRES}"
      Redis__ConnectionString: "redis:6379,abortConnect=false,password=${SERVICE_PASSWORD_REDIS}"
      Jwt__PrivateKeyPemBase64: "${JWT_PRIVATE_KEY:?copy JWT_PRIVATE_KEY from the old .env.vps}"
      Jwt__PublicKeyPemBase64: "${JWT_PUBLIC_KEY:?copy JWT_PUBLIC_KEY from the old .env.vps}"
      Jwt__Issuer: "AutoPartsERP"
      Jwt__Audience: "AutoPartsERP-Client"
      AllowedOrigins: "${ALLOWED_ORIGINS:-https://almajdauto.com,https://www.almajdauto.com}"
      App__PublicUrl: "${APP_PUBLIC_URL:-https://almajdauto.com/erp}"
      Seed__AdminEmail: "${SEED_ADMIN_EMAIL:-}"
      Seed__AdminUsername: "${SEED_ADMIN_USERNAME:-}"
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD:-}"
      Erpnext__Enabled: "${ERPNEXT_ENABLED:-true}"
      Erpnext__BaseUrl: "http://erpnext-frontend:8080"
      Erpnext__ApiKey: "${ERPNEXT_API_KEY:-}"
      Erpnext__ApiSecret: "${ERPNEXT_API_SECRET:-}"
      Governance__AllowSelfApproval: "${GOVERNANCE_ALLOW_SELF_APPROVAL:-false}"
      Assistant__GatewaySecret: "${ASSISTANT_GATEWAY_SECRET:-}"
      Ai__BaseUrl: "${AI_BASE_URL:-https://api.groq.com/openai/v1}"
      Ai__Model: "${AI_MODEL:-llama-3.3-70b-versatile}"
      Ai__ApiKey: "${AI_API_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    labels:
      - autoparts.service=api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoparts_erp}
      POSTGRES_USER: ${POSTGRES_USER:-autoparts}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    labels:
      - autoparts.service=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${SERVICE_PASSWORD_REDIS}
    volumes:
      - redis-data:/data
    labels:
      - autoparts.service=redis

  backup:
    build:
      context: .
      dockerfile: deploy/coolify/backup.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-autoparts_erp}
      POSTGRES_USER: ${POSTGRES_USER:-autoparts}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      ERPNEXT_DB_HOST: erpnext-db
      ERPNEXT_SITE: frontend
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      TZ: ${TZ:-Asia/Damascus}
      KEEP_DAILY: ${KEEP_DAILY:-14}
      KEEP_WEEKLY: ${KEEP_WEEKLY:-8}
      KEEP_MONTHLY: ${KEEP_MONTHLY:-12}
      BACKUP_HOST_DIR: ${BACKUP_HOST_DIR:-/var/backups/autoparts-erp}
    volumes:
      - ${BACKUP_HOST_DIR:-/var/backups/autoparts-erp}:/backups
      - erpnext-sites:/erpnext-sites:ro
    depends_on:
      - postgres
      - erpnext-db
    labels:
      - autoparts.service=backup
    exclude_from_hc: true

  # ---------------------------------------------------------------- ERPNext (frappe_docker pwd.yml, private)
  erpnext-db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_ERPNEXTDB}
      MARIADB_ROOT_PASSWORD: ${SERVICE_PASSWORD_ERPNEXTDB}
    volumes:
      - erpnext-db-data:/var/lib/mysql
    labels:
      - autoparts.service=erpnext-db
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10

  erpnext-redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    labels:
      - autoparts.service=erpnext-redis-cache

  erpnext-redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - erpnext-redis-queue-data:/data
    labels:
      - autoparts.service=erpnext-redis-queue

  erpnext-configurator:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.50.0}
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host erpnext-db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://erpnext-redis-cache:6379";
        bench set-config -g redis_queue "redis://erpnext-redis-queue:6379";
        bench set-config -g redis_socketio "redis://erpnext-redis-queue:6379";
        bench set-config -gp socketio_port 9000;
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    labels:
      - autoparts.service=erpnext-configurator
    exclude_from_hc: true

  # Creates the site "frontend" on the first deploy only; scripts/migrate-import.sh then restores the old data into it.
  erpnext-create-site:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.50.0}
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 180 erpnext-db:3306;
        wait-for-it -t 180 erpnext-redis-cache:6379;
        wait-for-it -t 180 erpnext-redis-queue:6379;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]]; do sleep 5; done;
        if [ -d sites/frontend ]; then echo "Site frontend exists"; else
        bench new-site --mariadb-user-host-login-scope='%' --admin-password="$$ADMIN_PASSWORD" --db-root-username=root
        --db-root-password="$$DB_ROOT_PASSWORD" --install-app erpnext --set-default frontend; fi
    environment:
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ERPNEXTADMIN}
      DB_ROOT_PASSWORD: ${SERVICE_PASSWORD_ERPNEXTDB}
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-db:
        condition: service_healthy
      erpnext-configurator:
        condition: service_completed_successfully
    labels:
      - autoparts.service=erpnext-create-site
    exclude_from_hc: true

  erpnext-backend:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.50.0}
    restart: unless-stopped
    environment:
      DB_ROOT_PASSWORD: ${SERVICE_PASSWORD_ERPNEXTDB}
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    labels:
      - autoparts.service=erpnext-backend

  # ERPNext's own web server: the api reaches it as http://erpnext-frontend:8080. No domain by default (private);
  # to open the ERPNext desk, give this service a domain in Coolify, e.g. https://books.almajdauto.com:8080.
  erpnext-frontend:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.50.0}
    restart: unless-stopped
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: erpnext-backend:8000
      SOCKETIO: erpnext-websocket:9000
      FRAPPE_SITE_NAME_HEADER: frontend
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    depends_on:
      - erpnext-backend
      - erpnext-websocket
    labels:
      - autoparts.service=erpnext-frontend

  erpnext-websocket:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.50.0}
    restart: unless-stopped
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      FRAPPE_REDIS_CACHE: redis://erpnext-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://erpnext-redis-queue:6379
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    labels:
      - autoparts.service=erpnext-websocket

  erpnext-queue-short:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.50.0}
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "short,default"]
    environment:
      FRAPPE_REDIS_CACHE: redis://erpnext-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://erpnext-redis-queue:6379
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    labels:
      - autoparts.service=erpnext-worker

  erpnext-queue-long:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.50.0}
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "long,default,short"]
    environment:
      FRAPPE_REDIS_CACHE: redis://erpnext-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://erpnext-redis-queue:6379
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    labels:
      - autoparts.service=erpnext-worker

  erpnext-scheduler:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.50.0}
    restart: unless-stopped
    command: ["bench", "schedule"]
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    labels:
      - autoparts.service=erpnext-worker

volumes:
  postgres-data:
  redis-data:
  erpnext-db-data:
  erpnext-redis-queue-data:
  erpnext-sites:
  erpnext-logs:
