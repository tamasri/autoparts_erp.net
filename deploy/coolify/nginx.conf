worker_processes auto;
events { worker_connections 1024; }

# Coolify variant of nginx/nginx.conf: plain HTTP on port 80 behind Coolify's proxy (Traefik), which terminates HTTPS
# for the domain. Routing, headers and limits are the same as the self-managed VPS config; keep the two in step.
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # The client's own address comes from Traefik's X-Forwarded-For (it sits on a private Docker network). Without this
    # every visitor would share Traefik's address, and the login rate limit would lock everybody out together.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=refresh:10m rate=20r/m;
    limit_req_status 429;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Allowed sources for the SPA: own origin, Google Fonts, blob: for the PDF preview/print frame, ws(s) for SignalR.
    # MUI (emotion) injects <style> tags, hence 'unsafe-inline' for styles only; scripts stay 'self'.
    # The Hangfire dashboard ships inline scripts, so it gets no CSP (it is SYSTEM_ADMIN-only anyway).
    map $request_uri $csp {
        ~^/hangfire "";
        default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-src 'self' blob:; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    }

    server {
        listen 80 default_server;
        server_name _;

        add_header X-Frame-Options           DENY;
        add_header X-Content-Type-Options    nosniff;
        add_header Referrer-Policy           strict-origin-when-cross-origin;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy   $csp always;
        add_header Permissions-Policy        "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
        # Private system: stronger than robots.txt (which is only a request), applies to every response incl. files and API.
        add_header X-Robots-Tag              "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, noai, noimageai" always;

        # Imports accept files up to 5 MB.
        client_max_body_size 6m;

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 120s;
        }

        location = /api/v1/auth/login {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass         http://api:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        }

        location = /api/v1/auth/refresh {
            limit_req zone=refresh burst=10 nodelay;
            proxy_pass         http://api:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        }

        location /hubs/ {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
            proxy_cache_bypass $http_upgrade;
        }

        # Private: health and metrics are read inside the Docker network (api:8080), never through the public entry.
        location /health  { return 404; }
        location /metrics { return 404; }

        # No IP restriction: Hangfire's own dashboard filter requires an authenticated SYSTEM_ADMIN session.
        location /hangfire {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        }

        # Dotfiles never belong in the build; without this the SPA catch-all would answer them with a 200.
        location ~ /\.(?!well-known/) {
            return 404;
        }

        # The app lives at /erp/ (frontend built with base /erp/). API, SignalR and Hangfire stay at the root.
        location /erp/ {
            root  /usr/share/nginx/html;
            try_files $uri $uri/ /erp/index.html;
        }

        # Hashed build files never change: cache them for a year. index.html is always revalidated.
        location /erp/assets/ {
            root  /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff;
            try_files $uri =404;
        }

        location = /erp {
            return 301 /erp/;
        }

        location = /robots.txt {
            root /usr/share/nginx/html/erp;
        }

        # The domain root and old links from before /erp (bookmarks, printed QR codes: /payments, /invoices/...).
        location / {
            return 301 /erp$request_uri;
        }
    }
}
