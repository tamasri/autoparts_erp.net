name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore AutoPartsERP.sln
      - run: dotnet build AutoPartsERP.sln -c Release
      - run: dotnet test AutoPartsERP.sln --no-build -c Release

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  # Secrets aren't readable from a job-level `if`, so surface their presence as an output.
  check-deploy-config:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS_HOST / VPS_USER / VPS_SSH_KEY are not set - skipping deployment. Add them in Settings > Secrets to enable automatic deploys."
          fi

  deploy:
    needs: [build-and-test, build-frontend, check-deploy-config]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.check-deploy-config.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t autoparts-erp-api:${{ github.sha }} .

      - name: Save image
        run: docker save autoparts-erp-api:${{ github.sha }} | gzip > api.tar.gz

      - name: Copy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "api.tar.gz,docker-compose.prod.yml"
          target: "/opt/autoparts-erp"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/autoparts-erp
            docker load < api.tar.gz
            docker compose -f docker-compose.prod.yml up -d --no-deps api
            rm api.tar.gz
            # The API applies migrations itself on start-up and stops if one fails, so a healthy API is the success signal.
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T api wget -qO- http://localhost:8080/health/ready >/dev/null 2>&1; then
                echo "API healthy"; exit 0
              fi
              sleep 5
            done
            echo "API did not become healthy (check: docker compose -f docker-compose.prod.yml logs api)"; exit 1
