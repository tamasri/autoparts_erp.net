worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=refresh:10m rate=20r/m;
    limit_req_status 429;

    # Allowed sources for the SPA: own origin, Google Fonts, blob: for the PDF preview/print frame, ws(s) for SignalR.
    # MUI (emotion) injects <style> tags, hence 'unsafe-inline' for styles only; scripts stay 'self'.
    # The Hangfire dashboard ships inline scripts, so it gets no CSP (it is SYSTEM_ADMIN-only anyway).
    map $request_uri $csp {
        ~^/hangfire "";
        default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-src 'self' blob:; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name your-domain.com;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header X-Frame-Options           DENY;
        add_header X-Content-Type-Options    nosniff;
        add_header X-XSS-Protection         "1; mode=block";
        add_header Referrer-Policy           strict-origin-when-cross-origin;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy   $csp always;
        add_header Permissions-Policy        "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
        # Private system: stronger than robots.txt (which is only a request), applies to every response incl. files and API.
        add_header X-Robots-Tag              "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, noai, noimageai" always;

        # Imports accept files up to 5 MB.
        client_max_body_size 6m;

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location = /api/v1/auth/login {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass         http://api:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/refresh {
            limit_req zone=refresh burst=10 nodelay;
            proxy_pass         http://api:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /hubs/ {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }

        location /health {
            # 127.0.0.1 never matches here: a request to the published port arrives from the
            # docker bridge gateway, not nginx's own loopback (see /metrics below, which already
            # allows that range). Kept private, just not to an address nothing can ever send from.
            allow 127.0.0.1;
            allow 172.0.0.0/8;
            deny  all;
            proxy_pass http://api:8080;
        }

        location /metrics {
            allow 172.0.0.0/8;
            deny  all;
            proxy_pass http://api:8080;
        }

        # No IP restriction: Hangfire's own dashboard filter already requires an authenticated
        # SYSTEM_ADMIN session (HangfireAuthorizationFilter), the same real check every other
        # protected route uses - not an extra layer to duplicate here.
        location /hangfire {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Dotfiles (.env, .git, ...) never belong in frontend/dist, but without this the SPA's own
        # catch-all below would answer them with index.html and a 200, masking a real leak instead
        # of 404ing it.
        location ~ /\. {
            deny all;
            return 404;
        }

        location / {
            root  /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
